<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

iframe#vidio {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    display: block;
}
</style>

<iframe
    id="vidio"
    src="https://i.pinimg.com/originals/67/c2/19/67c21909f786d78a4b4129113491ac2a.gif"
    frameborder="0"
    allowfullscreen
    sandbox="allow-forms allow-same-origin allow-scripts"
    

</iframe>

<div class="konten-atas">
</div>

<style>
.animate{
    transition:all .1s;
    -webkit-transition:all .1s;
}

.action-button{
    position:relative;
    padding:5px 10px;
    margin:0 10px 10px 0;
    border-radius:8px;
    font-family:'Rubik',sans-serif;
    font-size:20px;
    color:#FFF;
    text-decoration:none;
}

.blue{
    background:#3498DB;
    border-bottom:5px solid #2980B9;
    text-shadow:0 -2px #2980B9;
}

.green{
    background:#82BF56;
    border-bottom:5px solid #669644;
    text-shadow:0 -2px #669644;
}
</style>

<div id="offline-message" style="display:none;">
    No internet connection.
</div>

<script>
const iframe = document.getElementById("vidio");
const offlineMessage = document.getElementById("offline-message");

function checkConnection() {
    if (!navigator.onLine) {
        offlineMessage.style.display = "block";
        iframe.style.display = "none";
    } else {
        offlineMessage.style.display = "none";
        iframe.style.display = "block";
    }
}

window.addEventListener("online", checkConnection);
window.addEventListener("offline", checkConnection);
checkConnection();

iframe.addEventListener("load", checkConnection);
</script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const file = urlParams.get("call");

if (file) {
    iframe.src = file;
}
</script>

<div class="loading" id="loading"></div>
