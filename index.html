<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Custom Match Scores</title>

<style>

body{
margin:0;
background:#f2f2f2;
font-family:Arial,sans-serif;
}

.tabs{
display:flex;
gap:5px;
padding:10px;
}

.tabs button{
flex:1;
padding:12px;
border:none;
background:#0078ff;
color:#fff;
font-weight:bold;
cursor:pointer;
border-radius:6px;
}

.tabs button.active{
background:#004fc4;
}

.card{
background:#fff;
margin:10px;
border-radius:10px;
padding:12px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
overflow:hidden;
}

.team{
width:35%;
float:left;
text-align:center;
}

.center{
width:30%;
float:left;
text-align:center;
}

.logo{
width:55px;
height:55px;
object-fit:contain;
}

.score{
font-size:28px;
font-weight:bold;
}

.badge{
display:inline-block;
padding:4px 10px;
border-radius:20px;
color:#fff;
font-size:12px;
margin-top:5px;
}

.live{
background:#d60000;
}

.upcoming{
background:#0078ff;
}

.finished{
background:#28a745;
}

.info{
clear:both;
margin-top:10px;
padding-top:10px;
border-top:1px solid #eee;
text-align:center;
}

</style>
</head>
<body>

<div class="tabs">
<button class="active" onclick="showTab('live')">LIVE</button>
<button onclick="showTab('upcoming')">UPCOMING</button>
<button onclick="showTab('finished')">FINISHED</button>
</div>

<div id="matches"></div>

<script>

let allGames=[];
let currentTab='live';

function logo(id){
return `https://imagecache.365scores.com/image/upload/f_png,w_80,h_80,c_limit,q_auto:eco,dpr_2,d_Competitors:default1.png/v1/Competitors/${id}`;
}

function showTab(tab){

currentTab=tab;

document.querySelectorAll('.tabs button')
.forEach(btn=>btn.classList.remove('active'));

if(tab==='live')
document.querySelectorAll('.tabs button')[0].classList.add('active');

if(tab==='upcoming')
document.querySelectorAll('.tabs button')[1].classList.add('active');

if(tab==='finished')
document.querySelectorAll('.tabs button')[2].classList.add('active');

render();
}

function render(){

let games=[];

if(currentTab==='live')
games=allGames.filter(g=>g.statusGroup===3);

if(currentTab==='upcoming')
games=allGames.filter(g=>g.statusGroup===2);

if(currentTab==='finished')
games=allGames.filter(g=>g.statusGroup===4);

const container=document.getElementById('matches');

if(!games.length){
container.innerHTML='<div class="card">No matches available</div>';
return;
}

container.innerHTML='';

games.forEach(game=>{

const home=game.homeCompetitor||{};
const away=game.awayCompetitor||{};

let score='VS';
let badge='';
let cls='upcoming';

if(game.statusGroup===3){

score=`${home.score||0} - ${away.score||0}`;
badge=game.shortStatusText||'LIVE';
cls='live';

}

if(game.statusGroup===4){

score=`${home.score||0} - ${away.score||0}`;
badge='FT';
cls='finished';

}

if(game.statusGroup===2){

badge=new Date(game.startTime)
.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

}

container.innerHTML+=`

<div class="card">

<div class="team">
<img class="logo" src="${logo(home.id)}">
<div>${home.name||''}</div>
</div>

<div class="center">
<div class="score">${score}</div>
<div class="badge ${cls}">
${badge}
</div>
</div>

<div class="team">
<img class="logo" src="${logo(away.id)}">
<div>${away.name||''}</div>
</div>

<div class="info">
Match ID: ${game.id}
</div>

</div>

`;

});

}

async function loadMatches(){

try{

const res=await fetch('scores.php');
const data=await res.json();

allGames=data.games||[];

render();

}catch(e){

document.getElementById('matches').innerHTML=
'<div class="card">Failed to load matches</div>';

}

}

loadMatches();

setInterval(loadMatches,30000);

</script>

</body>
</html>
