<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B4X Sports Live Chat</title>
    <!-- Firebase App and Database SDKs (Compat version to match your template) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1c2733;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            background: #151515;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 85vh;
        }
        .chat-header {
            background: #1a73e8;
            padding: 12px;
            font-weight: bold;
            text-align: center;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #1c2733;
        }
        .message {
            margin-bottom: 15px;
            background: #121a23;
            padding: 8px 12px;
            border-radius: 8px;
            word-wrap: break-word;
        }
        .message .username {
            font-weight: bold;
            color: #ffe005;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .message img {
            max-width: 150px;
            border-radius: 4px;
            margin-top: 5px;
            display: block;
        }
        .chat-input-area {
            padding: 10px;
            background: #151515;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            background: #121a23;
            border: 1px solid #1c2733;
            color: white;
            padding: 10px;
            border-radius: 20px;
            outline: none;
        }
        #usernameInput {
            max-width: 120px;
        }
        button {
            background: #1a73e8;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        button#gif-btn {
            background: #ffe005;
            color: #000;
        }
        .gif-box {
            display: none;
            position: absolute;
            bottom: 110px;
            background: #121a23;
            border: 1px solid #1c2733;
            width: 90%;
            max-width: 400px;
            height: 250px;
            border-radius: 8px;
            z-index: 10;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
        .gif-search-bar {
            background: #151515;
            border: 1px solid #1c2733;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            outline: none;
            margin-bottom: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .gif-results {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .gif-results img {
            width: 100%;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">⚽ B4X Public Live Chat</div>
    <div class="chat-messages" id="chatMessages"></div>
    
    <div style="position: relative; width: 100%; display: flex; justify-content: center;">
        <div class="gif-box" id="gifBox">
            <input type="text" id="gifSearchInput" class="gif-search-bar" placeholder="Search GIPHY..." oninput="handleGifSearch()">
            <div id="gifResults" class="gif-results"></div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-row">
            <input type="text" id="usernameInput" placeholder="Your Name..." maxlength="15">
            <button id="gif-btn" onclick="toggleGifBox()">GIF</button>
        </div>
        <div class="input-row">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDC1VIx9cQ6D2ybOCEfPt0NKt9y5S23b8Y",
        authDomain: "livechat-6b9a0.firebaseapp.com",
        databaseURL: "https://livechat-6b9a0-default-rtdb.firebaseio.com", 
        projectId: "livechat-6b9a0",
        storageBucket: "livechat-6b9a0.firebasestorage.app",
        messagingSenderId: "730992403908",
        appId: "1:730992403908:web:6d3f5115393b782f1c7091"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("messages").limitToLast(50).on("child_added", (snapshot) => {
        const data = snapshot.val();
        const chatMessages = document.getElementById("chatMessages");
        
        let content = data.message;
        if(data.type === "gif") {
            content = `<img src="${data.message}" alt="gif">`;
        }

        chatMessages.innerHTML += `
            <div class="message">
                <div class="username">${data.username || "Anonymous"}</div>
                <div>${content}</div>
            </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    function getSenderName() {
        const nameInput = document.getElementById("usernameInput").value.trim();
        return nameInput !== "" ? nameInput : "Anonymous";
    }

    function sendMessage() {
        const input = document.getElementById("messageInput");
        if(input.value.trim() === "") return;

        db.ref("messages").push({
            username: getSenderName(),
            message: input.value,
            type: "text"
        });
        input.value = "";
    }

    document.getElementById("messageInput").addEventListener("keypress", function(e) {
        if(e.key === 'Enter') sendMessage();
    });

    // Integrated GIPHY Configuration
    const GIPHY_API_KEY = "oLK3TSYI8YzFI9xfLLHYHOwUGe4Is7Mn";
    let searchTimeout = null;

    function toggleGifBox() {
        const box = document.getElementById("gifBox");
        if(box.style.display === "flex") {
            box.style.display = "none";
        } else {
            box.style.display = "flex";
            document.getElementById("gifSearchInput").value = ""; // Reset search field
            loadGifs(""); // Load trending on open
        }
    }

    function handleGifSearch() {
        // Debounce search to avoid hitting API limit on every single keystroke
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const query = document.getElementById("gifSearchInput").value.trim();
            loadGifs(query);
        }, 400); 
    }

    function loadGifs(query = "") {
        const resultsContainer = document.getElementById("gifResults");
        resultsContainer.innerHTML = "Loading GIFs...";
        
        let url = `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_API_KEY}&limit=48&rating=g`;
        
        if(query !== "") {
            url = `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(query)}&limit=48&rating=g`;
        }
        
        fetch(url)
        .then(response => response.json())
        .then(content => {
            resultsContainer.innerHTML = "";
            if(content.data.length === 0) {
                resultsContainer.innerHTML = "No GIFs found.";
                return;
            }
            content.data.forEach(gif => {
                const imgUrl = gif.images.fixed_height_small.url;
                const img = document.createElement("img");
                img.src = imgUrl;
                img.onclick = function() {
                    sendGif(imgUrl);
                };
                resultsContainer.appendChild(img);
            });
        }).catch(err => {
            resultsContainer.innerHTML = "Error loading GIFs.";
        });
    }

    function sendGif(url) {
        db.ref("messages").push({
            username: getSenderName(),
            message: url,
            type: "gif"
        });
        document.getElementById("gifBox").style.display = "none";
    }
</script>

</body>
</html>
